name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # mainへの反映前に、ローカルMVPとCDK定義の最低限の破綻を検出します。
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: go test ./cmd/... ./internal/...
      - run: npm install
        working-directory: infra
      - run: npm run build
        working-directory: infra

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      # main反映時は必ずAWSデプロイするため、ロール未設定は失敗として検知します。
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AGENT_MONITOR_ZONE_NAME: ${{ vars.AGENT_MONITOR_ZONE_NAME }}
      AGENT_MONITOR_DASHBOARD_DOMAIN: ${{ vars.AGENT_MONITOR_DASHBOARD_DOMAIN }}
      AGENT_MONITOR_COGNITO_USER_POOL_ID: ${{ vars.AGENT_MONITOR_COGNITO_USER_POOL_ID }}
      AGENT_MONITOR_CODEX_EVENTS_TABLE_NAME: ${{ vars.AGENT_MONITOR_CODEX_EVENTS_TABLE_NAME }}
      AGENT_MONITOR_CLAUDE_EVENTS_TABLE_NAME: ${{ vars.AGENT_MONITOR_CLAUDE_EVENTS_TABLE_NAME }}
      AGENT_MONITOR_INGEST_FUNCTION_NAME: ${{ vars.AGENT_MONITOR_INGEST_FUNCTION_NAME }}
      AGENT_MONITOR_INGEST_API_KEY_NAME: ${{ vars.AGENT_MONITOR_INGEST_API_KEY_NAME }}
      AGENT_MONITOR_INGEST_USAGE_PLAN_NAME: ${{ vars.AGENT_MONITOR_INGEST_USAGE_PLAN_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate AWS deploy role
        if: env.AWS_ROLE_TO_ASSUME == ''
        run: |
          echo "::error::AWS_ROLE_TO_ASSUME secret is required for main deployments."
          exit 1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm install
        working-directory: infra
      - name: Deploy infrastructure once, then update app assets
        run: |
          if aws cloudformation describe-stacks --stack-name AgentMonitorStack --region "${AWS_REGION}" >/dev/null 2>&1; then
            npm run deploy:app
          else
            npm run deploy
          fi
        working-directory: infra
