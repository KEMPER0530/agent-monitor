<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">agent-monitor AWS構成</title>
  <desc id="desc">AWS公式アイコンを使ったagent-monitorのAWS構成図</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}.title{font-size:34px;font-weight:800}.box-title{font-size:20px;font-weight:800;text-anchor:middle}.box-sub{font-size:15px;font-weight:700;text-anchor:middle}.label{font-size:14px;font-weight:700;text-anchor:middle;fill:#334155}.node{rx:12;stroke-width:3}.line{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}.purple{stroke:#7c3aed;marker-end:url(#arrow-purple)}.green{stroke:#16a34a;marker-end:url(#arrow-green)}.gray{stroke:#475569;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
